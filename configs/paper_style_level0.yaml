  "architecture_change": "Single isolated variable relative to outputs/unetr_style_level0_full_width_decoder: upsampling mechanism inside the decoder's up_blocks. That run used monai.networks.blocks.UnetrUpBlock (learned transposed-convolution upsampling) under a mistaken belief it matched the original paper's own block; direct inspection of the paper's actual published code (RS2/network/up_block_unpooling.py) showed their real UnetrUpBlock uses free trilinear interpolation + a 1x1x1 conv instead (matching the paper's own stated text: 'used linear interpolation upsampling instead of transposed convolution'). This run uses PaperUnetrUpBlock, a faithful port of their real mechanism (models/query_mask_decoder.py). Same level0_width=32, same resolution, same hyperparameters, same feature-space flip+noise augmentation (not the richer paper-style one -- that is a separate variable, tested in outputs/unetr_style_level0_full_width_augmented_decoder/, not combined here) as outputs/unetr_style_level0_full_width_decoder, so this isolates the upsampling-mechanism question specifically.",
